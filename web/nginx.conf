server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаём index.html,
    # иначе react-router ломается при перезагрузке страницы
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксируем API на gateway — фронтенд ходит на /api,
    # браузер видит один origin, CORS не нужен вообще
    location /api/ {
        proxy_pass http://gateway:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}